# Spectra application config
# See: https://github.com/kaochenlong/spectra-app

# Spec directory path (relative to project root)
# New projects initialize at docs/spectra; configurations without this field resolve to openspec.
spec_dir: docs/spectra

# Language for AI-generated artifacts
locale: tw

# Workflow toggles
tdd: true
audit: true

# CLI command written into generated tool files (spectra, spxa)
# cli_command: spectra

# AI tools to generate instruction files for
# tools:
#   - claude
#   - cursor
