tw: &tw
  title: 這份班表的資料限制
  items:
    - 一張單是一台車，不是一個駕駛。雙班制下同一台車兩個人開，職號與姓名要由調度員填；四小時休息的數字寫的是「若一人開完這張單」。
    - 計畫行駛時間是涵蓋日子裡量到的百分位數，不是保證。選 p85 就是八成五的趟次跑得完的時間，剩下的趟次會超過，超過的分鐘從休息裡扣。超時比例表拿量到的趟次一趟一趟對照，前一趟晚到會不會推遲下一趟，班表不追。
    - 直接折返那一端的停留是量到的折返停留中位數，是車從末站開到下一趟起站的時間，不是休息。
    - 停留印成負數，表示手動打的發車時刻比前一趟到達還早：返回那趟比到達還早發車，或下一列比這一列返站還早發車。手動打的時刻照打的印、不會被推；沒打過的趟次接不上時，會自動往後推到停滿那一端的停留，推過的格子另外標出來。
    - 行駛時間只用起站、末站都有記錄到的完整趟次；每 10 秒抓一次資料一定會漏掉一些站，漏了起站或末站的趟次不算進去。那一小時不到 5 趟時退回該方向全天的百分位數，單子上有標記。
    - 預設的每小時發車數是涵蓋日子裡量到的趟次平均，每一種完整度都算；漏了起站的趟次，發車小時可能差一格。重建漏掉的趟次或當天減班，都會讓預設偏低。
