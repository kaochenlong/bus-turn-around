  <<: *tw
en:
  title: Limitations of this timetable
  items:
    - A sheet is a vehicle, not a driver. With two shifts per vehicle the driver number and name are the dispatcher's to fill in; the four-hour rest figure reads "if one person drove the whole sheet".
    - Planned run times are measured percentiles of the covered days, not guarantees. At p85, 85% of the measured trips finished within the planned time; the rest overran, and an overrun comes out of the rest. The overrun table judges the measured trips one by one and does not follow a late trip's effect on the next departure.
    - The hold at an end where buses drive on is the measured median layover, the time from the last stop to the next trip's first stop, and is not rest.
    - A negative stop means a typed departure leaves before the previous trip arrives, with the return trip or the next row departing before the arrival. Typed departures are printed as typed and never pushed; a departure that was not typed and no longer connects is pushed later until the hold at that end is kept, and its cell is marked.
    - Run times use only complete trips with both terminals observed; polling every 10 seconds always misses stops, and trips missing a terminal are left out. An hour with fewer than 5 trips falls back to the direction's all-day percentile, marked on the sheet.
    - The default departures per hour are the measured average over the covered days, trips of every completeness included; a trip missing its first stop may fall into the wrong hour. Trips the reconstruction missed, or a day with fewer runs, make the default too low.
