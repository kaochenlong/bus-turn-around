en:
  title: Round trips and cycles
  lead: A round trip runs from leaving %{first} to getting back to %{last}, including the stop at the other end. A cycle runs from a vehicle's return to %{last} to its next return there, with every rest in it, and is the rhythm the operator actually keeps. Where the tightest tenth of cycles is about as long as the median round trip, a vehicle gets back to the stopping end with almost no time to spare.
  caption: By the hour the first trip left (weekdays, hours with at least 5 values; minutes)
  aria: Round trip p50 and cycle p10 by the hour the first trip left, with hours where they differ by under 4 minutes shaded; the figures are in the run times table
  round_trip_legend: Round trip p50
  cycle_legend: Cycle p10 (the tightest tenth)
  tight_legend: Hours where they differ by under 4 minutes
