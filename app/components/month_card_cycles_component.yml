  title: 來回一趟與週期
  lead: 來回一趟是從%{first}發車，到回到%{last}為止，中間含另一端的停留。週期是這台車回到%{last}，到下一次再回到這一站，中間的休息都算在內。週期是業者實際維持的節奏。週期最緊的一成跟來回一趟的中位數差不多長的時段，車回到停車端幾乎沒有多餘的時間。
