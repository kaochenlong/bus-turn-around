en:
  title: Continuous driving
  lead: "Article 19-2 of the Regulations for Motor Vehicle Transport: after 4 hours of continuous driving, rest at least 30 minutes, each break at least 15 minutes. Where the work is continuous or traffic is congested it may be arranged otherwise, but continuous driving may not exceed 6 hours, followed by one rest of 45 minutes. Here the rule is applied to a vehicle's adjacent complete trips. A window runs from the start of a trip to the first trip that completes 4 (or 6) hours, and an incomplete trip cuts the sequence, so the denominator is only the windows that can be judged. These are numbers only, without a verdict: the data sees vehicles, not who drives them."
