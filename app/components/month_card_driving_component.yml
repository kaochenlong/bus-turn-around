tw: &tw
  title: 連續行駛
  lead: 汽車運輸業管理規則第 19 條之 2：連續駕車 4 小時至少休息 30 分鐘，分次休息每次不少於 15 分鐘；工作具連續性或交通壅塞時可以另外調配，但連續駕車不得超過 6 小時，且要一次休滿 45 分鐘。這裡把規定套在同一台車相鄰的完整趟次上，一個視窗從某一趟發車算起、到第一個滿 4（或 6）小時的趟次為止，不完整的趟次會切斷序列，所以分母只算能判斷的視窗。只報數字，不做判定：資料看得到車，看不到是誰在開。
