tw: &tw
  eyebrow: 換休息試算
  title: 每趟加緩衝
  note: 假設班表讓車在停車那一端每次多停幾分鐘再開下一趟，算算一天要多花幾車時、多派幾台車。1 車時就是一台車開一個小時。這裡算的是車，不是駕駛的工時。
  buffer_html: 緩衝 %{minutes} 分鐘
  submit: 重算
  coverage_html: "%{days} 天裡總共跑了 %{trips} 趟，試算只用在停車那一端量得到車停多久的 %{layovers} 次。"
  pass_through_html: "開過去就走那一端的 %{layovers} 次折返沒有算進來：車到了那裡直接開下一趟，不會停下來。"
  lower: 不夠 %{minutes} 分鐘的補足
  upper: 每次都多停 %{minutes} 分鐘
  vehicle_hours: 一天要多花幾車時
  peak_vehicles: 最忙的那個小時要多派幾台車
  bounds_note: 「不夠的補足」把車現在停的時間都當成休息，只補差額；「每次都多停」把現在停的時間都當成沒在休息，整段另外加。車停著的時候其實有一部分在回場、加油、等發車，所以真正要多花的會落在兩欄之間。多派的車數是把那個小時多出來的分鐘數除以 60 估的，實際排班會不一樣。
  achieved: 現在已經停到 %{minutes} 分鐘以上的比例
  vehicles_per_day: 現在一天平均有幾台車在跑
  no_layover: 這幾天在停車那一端量不到車停了多久，沒辦法試算。
zh-TW:
  <<: *tw
en:
  eyebrow: Rest trade-off
  title: A buffer at every layover
  note: Suppose the schedule lets buses stop a few more minutes at the end where they stop before the next trip, and see how many vehicle-hours and buses a day that adds. One vehicle-hour is one bus running for an hour. These are figures for buses, not driver hours.
  buffer_html: Buffer of %{minutes} minutes
  submit: Recalculate
  coverage_html: "%{trips} trips ran over %{days} days; the estimate uses only the %{layovers} times we could measure how long a bus stopped at the end where buses stop."
  pass_through_html: "The %{layovers} turnarounds at the end where buses drive on are left out: buses go straight on to the next trip there without stopping."
  lower: Top up to %{minutes} minutes when short
  upper: Add %{minutes} minutes every time
  vehicle_hours: Added vehicle-hours a day
  peak_vehicles: Added buses in the busiest hour
  bounds_note: "“Top up” counts the time buses stop now as rest and adds only the shortfall; “Add every time” counts none of it as rest and adds the whole buffer. Part of every stop goes to returning to the depot, refuelling and waiting, so the real cost lies between the two columns. Added buses are the hour's added minutes divided by 60, not a schedule."
  achieved: Stops already lasting %{minutes} minutes or more
  vehicles_per_day: Buses running a day on average now
  no_layover: No stop at the end where buses stop could be measured on these days, so there is nothing to estimate.
