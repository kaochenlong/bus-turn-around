zh-TW:
  <<: *tw
en:
  eyebrow: Rest trade-off
  title: A buffer at every layover
  note: Assume the schedule leaves a buffer at every layover at the ends where buses stop, and estimate the added vehicle-hours and vehicles. Only layovers measured at those ends count, and the figures are for vehicles, not drivers.
  buffer_html: Leave %{minutes} minutes at every layover
  submit: Recalculate
  coverage_html: "%{layovers} layovers measured at the ends where buses stop over %{days} days, out of %{trips} trips."
  pass_through_html: "%{layovers} more layovers were measured at the end where buses drive on: buses do not stop there, so they are not rest opportunities and are left out of the estimate."
  lower: Top up the shortfall to %{minutes} minutes
  upper: Add %{minutes} minutes to every layover
  vehicle_hours: Added vehicle-hours per day
  peak_vehicles: Added vehicles in the busiest hour
  bounds_note: A layover includes returning to the depot, refuelling and waiting, so it is an upper bound on rest and the real cost lies between the two columns. Vehicles are an hourly average, not a schedule.
  achieved: Layovers of at least %{minutes} minutes now
  vehicles_per_day: Vehicles in use per day now
  no_layover: No layover was measured at an end where buses stop on these days, so there is nothing to estimate.
