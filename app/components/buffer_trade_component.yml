  pass_through_html: "開過去就走那一端另外量到 %{layovers} 次折返停留，車在那裡不會停下來，不算休息的機會，所以沒有算進試算。"
  lower: 只把不夠的補到 %{minutes} 分鐘
  upper: 每次都多留 %{minutes} 分鐘
  vehicle_hours: 每天要多花幾車時
  peak_vehicles: 最忙的那個小時要多派幾台車
