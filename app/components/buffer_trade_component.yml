  coverage_html: "%{trips} trips ran over %{days} days; we could measure how long a bus stopped at the end where buses stop %{layovers} times."
  coverage_used_html: "The estimate uses only the %{used} of them that end%{condition}."
  condition_hours: " between %{from}:00 and %{to}:00"
  condition_end: " at %{stop}"
  condition_separator: ""
  pass_through_html: "The %{layovers} turnarounds at the end where buses drive on are left out: buses let passengers off there and go straight on to the next trip without waiting."
