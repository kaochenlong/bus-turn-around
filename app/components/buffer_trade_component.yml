en:
  eyebrow: Rest trade-off
  title: A buffer at every layover
  note: Suppose the schedule lets buses stop a few more minutes at the end where they stop before the next trip, and see how many vehicle-hours and buses a day that adds; you can also suppose buses get back there a few minutes later than measured. One vehicle-hour is one bus running for an hour. These are figures for buses, not driver hours.
