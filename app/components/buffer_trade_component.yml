  hourly_hour: Hour
  bounds_note: "“Top up” counts the time buses stop now as rest and adds only the shortfall; “Hold more every time” counts none of it as rest and adds the whole hold. Part of every stop goes to returning to the depot, refuelling and waiting, so the real cost lies between the two. Added buses are the hour's added minutes divided by 60, not a schedule."
  achieved_html: Stops already lasting %{minutes} minutes or more
  achieved_late_html: With the same buses, %{late} minutes later, stops still lasting %{minutes} minutes
