en:
  title: "Rest trade-off: a buffer at every layover"
  note: Assume the schedule leaves a buffer at every layover, and estimate the added vehicle-hours and vehicles. Only measured layovers count, and the figures are for vehicles, not drivers.
  buffer_html: Leave %{minutes} minutes at every layover
  submit: Recalculate
  coverage_html: "%{layovers} layovers measured over %{days} days, out of %{trips} trips."
  lower: Top up the shortfall
  upper: Add to every layover
  vehicle_hours: Added vehicle-hours per day
  peak_vehicles: Added vehicles in the busiest hour
  bounds_note: A layover includes returning to the depot, refuelling and waiting, so it is an upper bound on rest and the real cost lies between the two columns. Vehicles are an hourly average, not a schedule.
  achieved: Layovers of at least %{minutes} minutes now
  vehicles_per_day: Vehicles in use per day now
  no_layover: No layover was measured on these days, so there is nothing to estimate.
