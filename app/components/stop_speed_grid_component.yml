  no_speeds: 涵蓋的日子沒有站間車速。可能是這幾天在加上站間車速之前載入，要重新載入；也可能是那幾天的快照沒有路線軌跡。
  summary: 每兩站之間的時速與趟數
  table_note: 時速是同一格所有趟次的公尺加總除以秒數加總，括號裡是趟數；橘色數字表示樣本少於 5 趟，— 表示沒有量到。
