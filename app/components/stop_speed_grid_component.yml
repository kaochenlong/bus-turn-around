tw: &tw
  eyebrow: 站間車速
  title: 哪一段開最慢？
  note: 一格是相鄰兩站之間、一個時段，格子越深，車在這兩站之間開得越慢。車速是同一台車相鄰兩筆 GPS 沿臺北市公共運輸處登記的路線軌跡量的，站的前後 40 公尺不算，所以不含進出站與上下客；起點只有到站時刻的趟次不算。時段看車開到這一段的時刻，不是整趟發車的時刻。深淺只比同一個方向，數字在下面的表。
  fast: 快
  slow: 慢
  outline: 樣本少於 5 趟或量不到
  directions:
    "0": 去程
    "1": 返程
  bands:
    morning_peak: 早尖峰
    daytime: 日間
    evening_peak: 晚尖峰
    other: 其餘
  band_short:
    morning_peak: 早
    daytime: 日
    evening_peak: 晚
    other: 其
