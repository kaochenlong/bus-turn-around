en:
  eyebrow: Stop-to-stop speed
  title: Which stretch is slowest?
  note: Each cell is the stretch between two adjacent stops in one time band; the darker the cell, the slower buses ran between those stops. The speed is measured from consecutive GPS reports of a bus along the route shape registered by 臺北市公共運輸處, leaving out the 40 metres around each stop, so braking, stopping and boarding are not in it; trips whose start is only an arrival are left out. The band is the time the bus reached that stretch, not the time its trip started. Shades compare one direction only; the numbers are in the table below.
  fast: Fast
  slow: Slow
  outline: Fewer than 5 trips or not measured
  directions:
    "0": Outbound
    "1": Inbound
  bands:
    morning_peak: Morning peak
    daytime: Daytime
    evening_peak: Evening peak
    other: Other
  band_short:
    morning_peak: AM
    daytime: Day
    evening_peak: PM
    other: Oth
  direction_picker: Direction
  level_ranges: "Speed (km/h): lightest %{lightest} and above, then %{light} to %{lightest}, then %{dark} to %{light}, darkest below %{dark}."
  aria: "%{direction} from %{first} to %{last}: the speed between each two stops in four time bands; the numbers are in the table below"
  no_legs: This direction has no stop-to-stop speeds.
  no_speeds: The covered days have no stop-to-stop speeds. They may have been loaded before stop-to-stop speeds existed and need to be loaded again, or their snapshot had no route shape.
  summary: Speed and trips between each two stops
  table_note: The speed is a cell's total metres over its total seconds, with the number of trips in brackets; orange numbers mean fewer than 5 trips, — means not measured.
  leg: Between stops
  leg_name: "%{from} → %{to}"
  meters: Metres along the route
  trips:
    one: "%{count} trip"
    other: "%{count} trips"
  small_sample: small sample
