en:
  caption: Layovers
  note: Only pairs where the trip reached its last stop, the next one left its first stop and the vehicle ran no other route in between are counted; a missed stop at the other end does not matter. Half the layovers are shorter than p50, a tenth shorter than p10 and nine tenths shorter than p90.
  directions:
    "0": Outbound
    "1": Inbound
  direction: Ending trip
  last_stop: Ends at
  nature: Turnaround
  natures:
    stop: Stops
    pass_through: Drives on
  count: Layovers
  short: Under %{minutes} min
  minute_unit: min
  pass_through_note: At an end marked “Drives on”, buses let passengers off at the last stop and drive straight on to the first stop of the next trip without waiting, so the layovers there are not rest opportunities.
