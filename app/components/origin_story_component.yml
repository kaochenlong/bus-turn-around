  eyebrow: Where this site started
  heading: "“I started running yellow lights too!”"
  summary: In the summer of 2025, 鄭義穎, a master's student at National Yang Ming Chiao Tung University, drove 中山幹線 for 光華巴士 for two months. He had argued for driving slowly and putting safety first; within weeks he was running yellow lights himself. The schedule gives less time than a trip takes, and the driver can only make up the difference by driving faster or resting less. This site measures how long each bus actually stops at the end of the line before it leaves again.
