tw: &tw
  title: 資料限制
  items:
    - 車不等於人：資料只認得車牌，認不出是哪個駕駛。折返停留只是駕駛休息時間的上限，而且雙班制下一台車由兩個人開，這些數字沒辦法對應到某一個駕駛。
    - 車上人數是從刷卡資料推算的，不是真的點人頭，準不準要看乘客下車有沒有刷卡。量到的人數在一趟跑完、下一趟開始之前也不會歸零。
    - 每 10 秒抓一次資料，一定會漏掉一些站。漏了起站或末站的趟次，不算進行駛時間。
    - 平日跟假日是照人事行政總處的辦公日曆分的。颱風停班不在日曆裡，那幾天還是照日曆算。
    - 站牌靠近捷運出入口，不代表這一段可以被捷運取代，像是公車橫越捷運線的時候，路口附近的站也會被算進去。距離是直線距離，不是實際走路的距離，捷運出入口的資料也不是定期更新。
    - 換休息試算算的是車開了幾個小時，不是駕駛的工時。試算只用停車那一端量得到的折返，量不到的不另外估。多派幾台車是按小時平均估的，實際排班會不一樣。
    - 哪一端會停車，是一條一條路線人工查過之後寫進設定的，不是從資料算出來的；業者改了折返的方式，這個設定就會過期。開過去就走那一端的折返停留不算休息，試算也不會替那一端加緩衝。
    - 來回一趟與週期只算兩段都量到起站與末站、而且前後接得起來的趟次，所以筆數比趟次少。一台車當天的第一個來回沒有週期。週期是車的節奏，雙班制下對不到某一個駕駛的班表。
    - 停車那一端的位置，是那一天車停著等的時候最常停的地方。GPS 每 10 秒一筆，有時候一整段都沒有回報，那一天就量不到位置。位置是車停的地方，不是駕駛去的地方。
    - 開過去就走的那一端車不停，位置就用末站。
    - 公廁來自環境部每月更新的全國公廁建檔資料，男廁、女廁、無障礙廁所各算一間，頁面把同一個地址的廁所併成一處。距離是直線距離，不是走路的距離。資料沒有開放時段，也看不出駕駛能不能借用。
    - 地圖上的方塊是約 20 公尺見方的格子，一天內有 3 台以上的車停過才畫，少於 3 台的不畫。顏色深淺是車子停住時 GPS 回報的筆數（每 10 秒一筆），不是停了多久，也不代表在休息。底圖是外部的資料，照原樣顯示。
    - 站序那一塊的路線圖，畫的是臺北市公共運輸處登記的路線軌跡，不是 GPS 量到的，所以臨時改道、繞路不會出現在圖上。登記的軌跡也可能比站序舊。
    - 調度站查核分數是公運處評鑑時到業者營業站檢查的結果，不是折返點的設施；車在折返停留期間有沒有回調度站，資料量不到。分數照報告書附錄抄錄，兩欄是報告書印的兩欄，不平均、不解讀；名單只有這一期受檢的營業站，不在名單不代表沒有休息設施。
  member_item: "這一頁把路線 Id %{page_id} 與 %{members} 算成一條路線：趟次、行駛時間、折返停留、來回一趟、週期、換休息試算把這幾個 Id 的車合在一起算；沿線載客圖、捷運重疊與站序只用 %{page_id} 的站序，%{members} 在兩條都停的站的車上人數併進去，只有 %{members} 才停的站不畫。涵蓋的日子裡 %{trip_counts}。"
  member_trips: "%{id} %{count} 趟"
  home_title: 資料限制
  home_items:
    - 車不等於人：資料只認得車牌，認不出是哪個駕駛，折返停留也只是駕駛休息時間的上限。
    - 車上人數是從票證資料推算出來的，不是真的去點人頭，準不準要看乘客下車有沒有刷卡。
    - 每 10 秒抓一次資料，一定會漏掉一些站。
    - 同一筆事件可能出現在不同小時的檔案裡，分析之前會再把重複的拿掉。
zh-TW:
  <<: *tw
en:
  title: Data limitations
  items:
    - A vehicle is not a driver. A layover is an upper bound on rest; with two shifts per vehicle these numbers do not map to one driver.
    - On-board counts are derived from fare-card taps, not head counts, and depend on how many riders tap off; they do not return to zero between trips.
    - Polling every 10 seconds misses stops; trips missing their first or last stop are left out of run times.
    - "Weekdays and holidays follow the office calendar of the Directorate-General of Personnel Administration; days off for typhoons are not in it and count as the calendar says."
    - A stop near an MRT entrance does not mean the bus segment can be replaced by the MRT: stops near a crossing count too. Distances are straight-line, not walking distances, and the entrance data is updated irregularly.
    - The rest trade-off counts vehicle-hours, not driver hours, and uses only layovers measured at the ends where buses stop, without extrapolating to other trips. Added vehicles are an hourly average, not a schedule.
    - Which end buses stop at is verified route by route and written into the configuration, not computed from the data; it goes stale when the operator changes how the route turns around. Layovers at an end where buses drive on are not rest opportunities, and the rest trade-off does not count them.
    - Round trips and cycles use only trips whose first and last stops were both observed and that pair up as stored layovers, so their counts are lower than the trip counts. A vehicle's first loop of the day has no cycle. A cycle is the rhythm of a vehicle; with two shifts per vehicle it does not map to one driver's roster.
    - At an end where buses stop, the location is where vehicles stood still most densely during that day's layovers. GPS reports come every 10 seconds and can be missing for a whole day, and then that day has no location. It is where the vehicle stood, not where the driver went.
    - At an end where buses drive on, they do not stop, so the location is the last stop.
    - "Toilets come from the national registry of the Ministry of Environment, updated monthly, with one row per toilet; the page groups toilets at one address into one place. Distances are straight-line, not walking distances. The data has no opening hours and says nothing about whether a driver may use a toilet."
    - The squares on the maps are cells of about 20 metres that at least three vehicles stood in on a day; cells with fewer vehicles are not drawn. Their shade sums GPS standstill reports taken every 10 seconds and is neither minutes stood nor rest. The basemap is third-party data shown as it is.
    - The route map in the stop sequence block draws the route shape the Taipei City Public Transportation Office registers, not measured GPS, so temporary detours and diversions do not appear on it. The registered shape can be older than the stop list.
    - "The depot inspection scores are what the Taipei City Public Transportation Office recorded when it inspected the operators' stations for its evaluation, not the facilities of the turnaround point; whether a vehicle returns to its depot during a layover is not measured. The scores are copied from the report's appendix with the two columns it prints kept apart, neither averaged nor interpreted; the list covers only the stations inspected that term, so a station not on it is not known to lack rest facilities."
  member_item: "This page counts route Ids %{page_id} and %{members} as one route: trips, run times, layovers, round trips, cycles and the rest trade-off pool the vehicles of these Ids; the load chart, the MRT overlap and the stop sequence use the stops of %{page_id}, with the on-board counts of %{members} pooled at the stops both serve and the stops only %{members} serves left out. Over the covered days: %{trip_counts}."
  member_trips: "%{id}: %{count} trips"
  home_title: Data limitations
  home_items:
    - "A vehicle is not a driver: the data identifies plates, not drivers, and a layover is an upper bound on rest."
    - On-board counts are derived from fare-card taps, not head counts, and depend on how many riders tap off.
    - Polling every 10 seconds always misses stops.
    - Events can repeat across hourly files and are de-duplicated again before analysis.
