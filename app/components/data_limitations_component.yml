tw: &tw
  title: 資料限制
  items:
    - 車不等於人：資料認的是車牌，不是駕駛。折返停留是駕駛休息的上限；雙班制下一台車由兩個人開，這些數字對不回單一駕駛。
    - 車上人數是票證推出來的值，不是點人頭，準確度看下車刷卡率；實測它不會在趟次之間歸零。
    - 10 秒輪詢一定會漏站；漏了起站或末站的趟次不算行駛時間。
    - 平日與假日照人事行政總處的辦公日曆分；颱風停班不在日曆裡，那幾天照日曆算。
    - 站牌靠近捷運出入口，不等於這一段可以被捷運取代：公車橫越捷運線時，路口附近的站也會算進去。距離是直線距離，不是步行距離；捷運出入口資料不定期更新。
    - 換休息試算算的是車時，不是駕駛工時；只用停車端量到的折返停留，沒量到的趟次不推算。多幾台車是按小時平均的估計，不是排班結果。
    - 哪一端停車是逐路線查證後寫進設定的，不是從資料算的；業者改折返方式時，這個設定就會過期。開過去就走那一端的折返停留不是休息機會，試算不補它。
  home_title: 這些數字能信到哪
  home_items:
    - 車不等於人：資料認的是車牌，不是駕駛，折返停留是駕駛休息的上限。
    - 車上人數是票證推出來的值，不是點人頭，準確度看下車刷卡率。
    - 每 10 秒抓一次，一定會漏站。
    - 跨小時檔的事件可能重複，分析前會再去重一次。
