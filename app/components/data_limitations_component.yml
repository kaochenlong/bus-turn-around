tw: &tw
  title: 資料限制
  items:
    - 車不等於人：資料只認得車牌，認不出是哪個駕駛。折返停留只是駕駛休息時間的上限，而且雙班制下一台車由兩個人開，這些數字沒辦法對應到某一個駕駛。
    - 車上人數是從票證資料推算出來的，不是真的去點人頭，準不準要看乘客下車有沒有刷卡。實際量到的人數，在一趟跑完到下一趟開始之間也不會歸零。
    - 每 10 秒抓一次資料，一定會漏掉一些站。漏了起站或末站的趟次，不算進行駛時間。
    - 平日跟假日是照人事行政總處的辦公日曆分的。颱風停班不在日曆裡，那幾天還是照日曆算。
    - 站牌靠近捷運出入口，不代表這一段可以被捷運取代，像是公車橫越捷運線的時候，路口附近的站也會被算進去。距離是直線距離，不是實際走路的距離，捷運出入口的資料也不是定期更新。
    - 換休息試算算的是車的時數，不能直接當成駕駛的工時。試算只用停車那一端量到的折返停留，沒量到的趟次不會另外推估。多幾台車是按小時平均估出來的，實際排班可能會不一樣。
    - 哪一端會停車，是一條一條路線人工查證之後寫進設定的，不是從資料算出來的，所以業者改了折返的方式，這個設定就會過期。開過去就走那一端的折返停留不算休息的機會，試算不會替那一端補緩衝。
    - 來回一趟與週期只用兩段都量到起站與末站、而且在折返停留裡配得起來的趟次，所以筆數會比趟次數少。一台車當天第一個來回沒有週期。週期是車的節奏，雙班制下對不回某一個駕駛的班表。
  home_title: 資料限制
