en:
  title: Layovers
  lead: The time from a vehicle's arrival at the last stop of a trip to its departure from the first stop of the next. It includes everything from returning to the depot to refuelling, washing and waiting to leave, so it is an upper bound on a driver's rest, not working time. Only measurable layovers count. The trip reached its last stop, the next left from its first stop, and the vehicle ran no other route in between. p10, p50 and p90 mean a tenth, half and nine tenths are shorter than this.
  ending_trip: Ending trip
  ending_stop: Ends at
  nature: Turnaround
  count: Count
  short: Under 15 min
  natures:
    stop: Stops
    pass_through: Drives on
  pass_through_note: At a drive-on end the vehicle lets passengers off at the last stop and drives straight to the first stop of the next trip without waiting, so a layover there is not rest.
  stopping_end: Stopping end
  distribution_caption: "%{end_name}: layovers by length (weekdays, %{count})"
  hours_caption: "%{end_name}: share under 15 minutes by the hour the vehicle came back (weekdays)"
  few_layovers_note: A grey column has fewer than 10 layovers; its share alone can mislead.
