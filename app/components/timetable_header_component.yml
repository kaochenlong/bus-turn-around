en:
  eyebrow: Timetable
  print: Print
  covered: Days covered
  figures:
    percentile: Run time percentile
    buffer: Rest at the stopping end (min)
    vehicles_per_day: Measured vehicles per day
    vehicles: Vehicles in the timetable
    departures_0: Outbound departures
    departures_1: Inbound departures
    edited: Manual edits
  edited_unit: cells
  two_estimates: "Measured vehicles per day counts the distinct plates that ran on each covered day, swaps, spares and half-day buses included. Vehicles in the timetable is how many buses are on the road at once when these departures are laid out with these run times and holds: each bus runs from its first trip to its last with only the set stop between trips, so it is usually fewer than the buses actually used. Vehicle numbers are the order buses were put on the road, not plates."
  controls:
