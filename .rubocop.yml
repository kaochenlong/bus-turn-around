# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable

# spec/analysis 測的是 SQL 檔、fixture 與 bin/health-card，spec/assets 測的是圖檔，都沒有 Ruby 類別可以 describe
RSpec/DescribeClass:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "spec/analysis/**/*"
    - "spec/assets/**/*"
