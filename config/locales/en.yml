# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  site:
    name: "TurnAround"
    description: "Two numbers for Taipei buses, route by route: how long the rest at the turnaround actually is, and how many people ride the stretches that overlap the MRT."
    share_image_alt: "A teal bus logo framed by a turning route, with the TurnAround name."
  share_preview:
    title: "%{route_name} | %{site_name}"
    coverage_day: "%{day}, %{day_type}"
    coverage_7d: "the last 7 days up to %{day}, %{count} %{day_type} days"
    stopping_end: "stopping end %{stop}: %{count} layovers measured, median %{p50} min, %{share} under %{minutes} min"
    stopping_end_without_layovers: "stopping end %{stop}: 0 layovers"
    no_stopping_end: "Buses drive straight on at both ends; neither end is a stopping end"
    ends_separator: "; "
    description: "%{span}, %{coverage}: %{ends}. %{bound}"
    bound: "A layover is an upper bound on the driver's rest, not working time."
    span: "%{departure}–%{destination}"
  day_types:
    weekday: weekday
    holiday: holiday
  directions:
    "0": outbound
    "1": inbound
  timetables:
    show:
      eyebrow: Timetable
      needs_script: "This page needs JavaScript to lay the timetable out: the layout and the edits are computed in the browser."
      add_vehicle:
        title: Add a vehicle
        direction: First trip's direction
        departure: First trip's departure
        button: Add a vehicle
      document_title: "%{route} timetable | %{site}"
      document_title_without_route: "Timetable | %{site}"
      no_data: "No data for %{day}; no timetable can be laid out."
      no_days: This route has no data yet; no timetable can be laid out.
      no_run_times: "Over the covered days no %{directions} trip has a complete run time; no timetable can be laid out."
  maps:
    gestures:
      wheel_zoom: "Hold {key} and scroll to zoom the map"
      two_fingers: "Use two fingers to move or zoom the map"
    fullscreen:
      enter: Full screen
      exit: Exit full screen
