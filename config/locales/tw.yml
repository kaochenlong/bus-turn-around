tw:
  site:
    name: "折返點 TurnAround"
    description: "逐條路線量台北公車的兩個數字：折返點實際能休幾分鐘，以及跟捷運重疊的路段實際載多少人。"
    share_image_alt: "青綠色公車標誌與折返路線，搭配折返點 TurnAround 名稱。"
  # 路線頁涵蓋到資料時自己的 title 與分享文字，由 RoutePage::SharePreview 組
  share_preview:
    title: "%{route_name}｜%{site_name}"
    coverage_day: "%{day}%{day_type}"
    coverage_7d: "到 %{day}為止的最近 7 天，%{day_type} %{count} 天"
    stopping_end: "停車端%{stop}：量到 %{count} 次折返停留，中位數 %{p50} 分鐘，%{share} 不到 %{minutes} 分鐘"
    stopping_end_without_layovers: "停車端%{stop}：折返停留 0 次"
    no_stopping_end: "兩端都是直接折返，沒有停車的一端"
    ends_separator: "；"
    description: "%{span}，%{coverage}：%{ends}。%{bound}"
    bound: "折返停留是駕駛休息的上限，不是工時。"
    span: "%{departure}－%{destination}"
  day_types:
    weekday: 平日
    holiday: 假日
  # 時刻的寫法，班表的單子與當天調度共用：過了午夜的時刻，與打不出來的時刻怎麼說
  times:
    next_day: "隔日 %{time}"
    rejected_typed: "「%{typed}」不是時刻。%{writings}"
    accepted_writings: "時刻可以打 0530、530、5:30 或 05:30；過了午夜從 24 接著算，凌晨 00:45 打 2445，最晚 29:59。"
  # 鋪排用的行駛時間百分位數與停車端的休息，班表頁與當天調度頁的今天的計畫共用
  plan_controls:
    percentile: 行駛時間取第幾百分位
    percentile_option: "p%{value}"
    buffer: 停車端每次休息（分）
  # 趟次的兩個方向（go_back），班表頁與單子共用
  directions:
    "0": 去程
    "1": 返程
  day_dispatches:
    show:
      document_title: "%{route} 當天調度｜%{site}"
      document_title_without_route: "當天調度｜%{site}"
      needs_script: 這一頁要有 JavaScript：當天調度存在這台電腦的瀏覽器裡，也在瀏覽器裡算。
  timetables:
    show:
      eyebrow: 班表
      needs_script: 這一頁要有 JavaScript 才鋪得出班表：鋪排與微調都在瀏覽器裡算。
      add_vehicle:
        title: 再加一台車
        direction: 第一趟的方向
        departure: 第一趟的發車時間
        button: 加一台車
      # 當天調度的入口：用鋪好的單開始當天，或繼續這台電腦存著的那一天
      document_title: "%{route} 班表｜%{site}"
      document_title_without_route: "班表｜%{site}"
      no_data: "%{day} 沒有資料，鋪不出班表。"
      no_days: 這條路線還沒有任何資料，鋪不出班表。
      no_run_times: "涵蓋的日子裡，%{directions}沒有任何一趟量到完整的行駛時間，鋪不出班表。"
  # 路線頁地圖的手勢提示與全螢幕按鈕，兩種地圖共用；{key} 留給 maps/base_map.js 填 ⌘ 或 Ctrl
  maps:
    gestures:
      wheel_zoom: "按住 {key} 再滾動，就能縮放地圖"
      two_fingers: "用兩根手指移動或縮放地圖"
    fullscreen:
      enter: 全螢幕
      exit: 離開全螢幕
