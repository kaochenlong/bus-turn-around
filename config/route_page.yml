# Routes that have a route page. A route is added only after its definitions
# have been checked on its own data; 15373 is 中山幹線, 10712 is 251 and
# 11764 is 251區. The tests use the fixture route 9001.
#
# Each route gives the nature of both of its ends, keyed by the direction
# (go_back) of the trips that end there: stop when buses stop there before
# the next trip, pass_through when they drive on to the first stop of the
# next trip without waiting there. It is verified by hand on the route's own
# data, with the date and the evidence next to the value, and goes stale when
# the operator changes how the route turns around.
shared:
  routes:
    15373:
      ends:
        # Verified 2026-10-22: outbound trips end at 青年公園(馬場町) and the
        # next trip leaves 青年社宅, about 200 m away in a straight line. On
        # 2026-10-20 the 75 layovers there had a median of 1.9 minutes, and
        # the GPS never left that stretch.
        0: pass_through
        1: stop # Inbound trips end at 職能發展學院二.
    10712:
      ends:
        # Verified 2026-10-23 on the data of 2026-10-22: outbound trips end at
        # 臺北車站(開封) and the next trip leaves 重慶南路一段, 88 m away. The
        # 36 layovers there had a median of 2.3 minutes; in none of them did
        # the GPS get more than 121 m from the nearer of the two stops, or the
        # bus stand still for more than 2.0 minutes.
        0: pass_through
        # Verified 2026-10-23 on the data of 2026-10-22: inbound trips end at
        # 福安居一 and the next trip leaves 福安居, 140 m away. The 30 layovers
        # there had a median of 44.4 minutes; in nine of ten the GPS stayed
        # within 136 m of the nearer stop, and the longest standstill in each
        # had a median of 14.4 minutes.
        1: stop
    11764:
      ends:
        # Verified 2026-10-23 on the data of 2026-10-22: outbound trips end at
        # 捷運公館站 and the next trip leaves 台電大樓, 616 m away. The 53
        # layovers there had a median of 2.8 minutes; in none of them did the
        # GPS get more than 139 m from the nearer of the two stops, or the bus
        # stand still for more than 1.3 minutes. No point falls in the middle
        # of the 616 m only because the GPS reports have a gap there.
        0: pass_through
        # Verified 2026-10-23 on the data of 2026-10-22: inbound trips end at
        # 福安居一 and the next trip leaves 福安居, 140 m away. The 38 layovers
        # there had a median of 19.7 minutes; in nine of ten the GPS stayed
        # within 112 m of the nearer stop, and the longest standstill in each
        # had a median of 3.5 minutes.
        1: stop
    16111:
      # 307 counts 307西藏三民 (19108) with it: same two ends, a different
      # street in the middle; see docs/spectra/changes/02-route-307-page.
      member_routes: [19108]
      ends:
        # Verified 2026-10-24 on the data of 2026-10-22, the two route Ids
        # paired together: outbound trips end at 莊敬里 and the next trip
        # leaves 莊敬里, 34 m away. The 215 layovers there had a median of
        # 13.3 minutes; in 168 of them the bus stood still for at least
        # 2 minutes (median longest standstill 4.8 minutes), at a spot about
        # 300 m from the stop where no stop is registered. Since the change
        # drop-single-stop-segments the same day has 188 layovers there with
        # a median of 16.4 minutes: the pairs it removed were short ones that
        # started from a segment observing a single stop, so it is still a
        # stop.
        0: stop
        # Verified 2026-10-24 on the data of 2026-10-22: inbound trips end at
        # 臺北客運板橋前站(藝文) and the next trip leaves the same stop. The
        # 225 layovers there had a median of 14.4 minutes; in 198 of them the
        # bus stood still for at least 2 minutes (median longest standstill
        # 11.0 minutes), and nine of ten standstill reports were within 50 m
        # of the stop. Since the change drop-single-stop-segments the same day
        # has 185 layovers there with a median of 17.8 minutes: the pairs it
        # removed were short ones that started from a segment observing a
        # single stop, so it is still a stop.
        1: stop
    10283:
      # 235 (新莊－國父紀念館). Both ends verified 2026-11-01 on the
      # network-wide survey of 2026-10-19 to 2026-10-22 run by change
      # 02-end-nature-survey (bin/rails survey:end_natures), which measures
      # the same two numbers as the verifications above with the same SQL
      # and agreed with all eight ends configured above. The figures are the
      # four days together, from tmp/end-natures/report-2026-10-19_2026-10-22.csv,
      # also tabled in the design of change daan-top-three-routes.
      ends:
        # Outbound trips end at 交通部觀光署 and the next trip leaves
        # 國父紀念館, 323 m away. The 464 layovers there with GPS had a
        # median of 4.1 minutes (p10 2.9, p90 4.8); in 14 of them (3.0%) the
        # bus stood still for more than 2 minutes, the longest standstill
        # had a median of 0.7 and a maximum of 4.0 minutes, and the GPS
        # never got more than 236 m (p90 221 m) from the nearer of the two
        # stops.
        0: pass_through
        # Inbound trips end at 西盛 and the next trip leaves the 西盛 stop of
        # the other direction, 86 m away. The 251 layovers there with GPS
        # (252 in all) had a median of 47.0 minutes (p10 16.1, p90 119.5);
        # in 215 of them (85.7%) the bus stood still for more than 2
        # minutes, the longest standstill had a median of 26.3 and a
        # maximum of 314.6 minutes, and nine of ten stayed within 163 m of
        # the nearer stop (maximum 2,134 m).
        1: stop
    11833:
      # 復興幹線 (建國北路－景美). Both ends verified 2026-11-01 on the
      # network-wide survey of 2026-10-19 to 2026-10-22 run by change
      # 02-end-nature-survey, four days together, from
      # tmp/end-natures/report-2026-10-19_2026-10-22.csv.
      ends:
        # Outbound trips end at 景華公園 and the next trip leaves 景美國中,
        # 280 m away. The 432 layovers there with GPS had a median of 3.2
        # minutes (p10 2.3, p90 4.3); in none of them did the bus stand
        # still for more than 2 minutes (longest standstill median 0.3,
        # maximum 2.0 minutes), and the GPS never got more than 182 m
        # (p90 173 m) from the nearer of the two stops.
        0: pass_through
        # Inbound trips end at 建北站 and the next trip leaves the same stop.
        # The 230 layovers there with GPS (242 in all) had a median of 17.4
        # minutes (p10 7.4, p90 35.1); in 138 of them (60.0%) the bus stood
        # still for more than 2 minutes, the longest standstill had a median
        # of 4.2 and a maximum of 107.7 minutes, and nine of ten stayed
        # within 184 m of the stop (maximum 206 m).
        1: stop
    10832:
      # 22 (松德站－衡陽路). Both ends verified 2026-11-01 on the
      # network-wide survey of 2026-10-19 to 2026-10-22 run by change
      # 02-end-nature-survey, four days together, from
      # tmp/end-natures/report-2026-10-19_2026-10-22.csv.
      ends:
        # Outbound trips end at 二二八和平公園 and the next trip leaves
        # 博愛路, 141 m away. The 362 layovers there with GPS had a median of
        # 1.8 minutes (p10 1.1, p90 2.8); in none of them did the bus stand
        # still for more than 2 minutes (longest standstill median 0.0,
        # maximum 1.3 minutes), and the GPS never got more than 283 m
        # (p90 100 m) from the nearer of the two stops.
        0: pass_through
        # Inbound trips end at 松德站 and the next trip leaves the 松德站
        # stop of the other direction, 28 m away. The 280 layovers there
        # with GPS (286 in all) had a median of 22.8 minutes (p10 7.6, p90
        # 70.4); in 159 of them (56.8%) the bus stood still for more than 2
        # minutes, the longest standstill had a median of 7.0 and a maximum
        # of 152.7 minutes, and nine of ten stayed within 176 m of the
        # nearer stop; the 24,833 m maximum is a GPS outlier.
        1: stop

test:
  routes:
    9001: # Both ends stop, so the fixture numbers do not change.
      # 9050 is the fixture's member route: its own route Id, one stop
      # different from 9001, counted with 9001 on the same page.
      member_routes: [9050]
      ends:
        0: stop
        1: stop
