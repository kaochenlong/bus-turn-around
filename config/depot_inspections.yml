# The evaluation reports of 臺北市公共運輸處 whose depot inspection scores the
# route pages show, one term each (docs/spectra/changes/03-depot-inspection-scores).
# download_url is the report's PDF; bin/rails external:pto_assessment TERM=<term>
# saves it under the data root and compares its sha256 with sha256, the file
# the scores were copied from.
#
# The scores are copied by hand from appendix 1 of the report, the depot
# inspection score sheets (臺北市公共運輸處市區公車場站檢查評分表), only for the
# depots the vehicles of a route with a route page belong to. items are the
# nine columns copied, named as the sheet's header prints them, with their
# weight in percent. A depot names its operator and station exactly as
# GetProvider.gz does (nameZn, stationNameZn), because the route page matches
# them with route_day_depots character for character; printed_as is how the
# appendix prints them, inspected_on the inspection date as printed, without a
# year, and printed_page the appendix page. scores gives every item the two
# columns the sheet prints, as they are, never averaged. not_in_appendix lists
# depots looked for on every page of the appendix and not found there.
#
# The depots are those route_day_depots gives the route pages' trips of
# 2026-10-19 to 2026-10-23, each trip's StationID by majority vote, named by
# GetProvider.gz of the same days; a route page added later has its depots
# looked up the same way before they are copied here. A StationID that only
# turns up in a stray event, not in a trip, is no depot of the route.
shared:
  terms:
    115-1:
      title: 115年第1期臺北市市區公車營運服務指標評鑑總體報告書
      announced_on: 2026-07-21
