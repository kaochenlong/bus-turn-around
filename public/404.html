<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>這一站沒有停靠｜折返點 TurnAround</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
      /* 靜態檔拿不到 Vite 打包後帶 hash 的 CSS，樣式寫在這裡。
         配色照首頁插圖的站牌（app/frontend/hero/scene.js 的 stopSign()）：琥珀色的牌面，深色的頂條與桿子 */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Barlow", "Noto Sans TC", ui-sans-serif, system-ui, sans-serif;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.65;
        -webkit-text-size-adjust: 100%;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .sign {
        width: min(100%, 22rem);
        overflow: hidden;
        border-radius: 12px;
        background: #fbbf24;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.08), 0 12px 32px rgb(15 23 42 / 0.12);
        text-align: center;
      }

      .sign-band {
        margin: 0;
        padding: 10px 16px;
        background: #1e293b;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 28px 24px 0;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.06em;
      }

      .sign-route {
        display: flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        margin: 20px auto 0;
        padding: 4px;
        border-radius: 8px;
        color: inherit;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
      }

      .sign-route:focus-visible {
        outline: 2px solid #0f172a;
        outline-offset: 2px;
      }

      .route-number {
        padding: 0 12px;
        border-radius: 6px;
        background: #1e293b;
        color: #fff;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.02em;
      }

      .route-destination {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.25em;
      }

      .sign-route:hover .route-destination {
        text-decoration-thickness: 2px;
      }

      .sign-note {
        margin: 24px 0 0;
        padding: 14px 24px 18px;
        border-top: 1px solid rgb(15 23 42 / 0.2);
        font-size: 15px;
        line-height: 1.6;
      }

      .pole {
        position: relative;
        width: 16px;
        height: clamp(88px, 24vh, 220px);
        background: #1e293b;
      }

      .pole::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 64px;
        height: 10px;
        border-radius: 5px 5px 0 0;
        background: #1e293b;
        transform: translateX(-50%);
      }

      @media (min-width: 640px) {
        .sign {
          width: 24rem;
        }

        h1 {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="sign">
        <p class="sign-band">折返點 TurnAround</p>
        <h1>這一站沒有停靠</h1>
        <a class="sign-route" href="/"><span class="route-number">404</span> <span class="route-destination">往 首頁</span></a>
        <p class="sign-note">網址可能打錯了，或是這一頁已經不在了。</p>
      </div>
      <div class="pole" aria-hidden="true"></div>
    </main>
  </body>
</html>
